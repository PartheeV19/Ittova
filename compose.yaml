services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ittova}
      POSTGRES_USER: ${POSTGRES_USER:-ittova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ittova_postgres_data:/var/lib/postgresql/data

volumes:
  ittova_postgres_data:
